<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mongongo Way</title>
  <meta name="description" content="La voix des musiciens de Theway RDC : écoutez gratuitement, soutenez les artistes.">
  <meta name="theme-color" content="#141022">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=22">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('mw-theme')==='jour'?'jour':'nuit'}catch(e){document.documentElement.dataset.theme='nuit'}</script>
</head>
<body>
  <header class="entete">
    <a href="#/accueil" class="logo">
      <img src="icon-192.png" alt="" width="32" height="32">
      <span>Mongongo <b>Way</b></span>
    </a>
    <div class="entete-actions">
      <button id="btn-theme" class="rond" type="button" title="Passer en mode jour">☀</button>
      <a id="btn-messages" class="rond" href="#/messages" title="Messages">✉<span id="badge-msg" class="pastille cache">0</span></a>
    </div>
  </header>

  <main id="vue" class="vue" aria-live="polite"></main>

  <!-- Lecteur audio -->
  <div id="lecteur" class="lecteur cache">
    <img id="lecteur-pochette" class="lecteur-pochette" alt="">
    <div class="lecteur-infos">
      <div id="lecteur-titre" class="lecteur-titre"></div>
      <div class="lecteur-artiste"><span id="lecteur-artiste"></span> · <span id="lecteur-mode" class="lecteur-mode">Aléatoire</span></div>
      <input id="lecteur-barre" class="lecteur-barre" type="range" min="0" max="100" value="0" step="0.1" aria-label="Position">
    </div>
    <button id="lecteur-bouton" class="lecteur-bouton" aria-label="Lecture / pause">▶</button>
    <audio id="audio" preload="none"></audio>
  </div>

  <nav id="nav" class="nav cache">
    <div class="nav-titre">Menu</div>
    <a href="#/accueil" data-route="accueil"><span class="ico">⌂</span>Accueil</a>
    <a href="#/fil" data-route="fil"><span class="ico">✦</span>Fil</a>
    <a href="#/soutien" data-route="soutien"><span class="ico">♥</span>Soutien</a>
    <a href="#/artiste" data-route="artiste"><span class="ico">♪</span>Artiste</a>
    <a href="#/profil" data-route="profil"><span class="ico">◉</span>Profil</a>
  </nav>

  <div id="toast" class="toast" role="status"></div>
  <div id="modale" class="modale cache"><div class="modale-boite" id="modale-boite"></div></div>

  <script type="module" src="app.js?v=22"></script>
</body>
</html>
